[project]
name = "backend"
version = "0.1.0"
description = "FastAPI backend for the AI learning assistant"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.1",
    "argon2-cffi>=25.1.0",
    "fastapi[standard]>=0.165.0",
    "fastembed>=0.9.1",
    "google-genai>=3.6.1",
    "pgvector>=0.5.1",
    "psycopg[binary]>=3.3.9",
    "pydantic-settings>=2.16.3",
    "pyjwt>=2.15.1",
    "pypdf>=7.1.1",
    "python-docx>=1.2.0",
    "sqlalchemy>=2",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# Mongolian prompt / reply texts: long lines read better than split sentences.
"app/ai/prompt.py" = ["E501"]
"app/ai/rules.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["real_embeddings: use the real embedding model (slow; downloads it once)"]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.6",
]
